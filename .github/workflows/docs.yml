name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "kiln/**", "tools/docgen/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `pnpm build` runs `odin doc` and tools/docgen for the API pages.
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-10
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: withastro/action@v6
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
